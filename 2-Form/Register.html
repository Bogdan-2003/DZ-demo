<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register</title>
    <link rel="stylesheet" href="Register.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <main>
      <h1>Регистрация</h1>
      <p>Уже есть аккаунт?<a href="#">Войти</a></p>
      <form action="#" class="form">
        <div class="company">
          <label for="text">Мой компания</label>
          <input
            type="text"
            id="text"
            placeholder="Мой компания"
          />
        </div>

        <div class="name">
          <label for="text">Имя</label>
          <input type="text" id="text" name="text" placeholder="Имя" />
          <label for="text">Фамилия</label>
          <input type="text" id="text" name="text" placeholder="Фамилия" />
        </div>

        <div class="email">
          <label for="email">E-mail</label>
          <input type="email" id="email" placeholder="E-mail" />
        </div>

        <div class="button">
          <button>Зарегистрироваться</button>
        </div>

        <div class="checkbox">
          <input type="checkbox" name="agree" id="agree" />
          <p>Я прочитал и принимаю</p>
          <a href="#">Условия использования</a>
        </div>
      </form>
    </main>
  </body>
</html>
