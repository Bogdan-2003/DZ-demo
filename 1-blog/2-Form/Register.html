<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register</title>
  </head>
  <body>
    <main>
      <h1>Регистрация</h1>
      <p>Уже есть аккаунт? <a href="#">Войти</a></p>
      <form action="#">
        <div>
          <label for="company">Мой компания</label>
          <input
            type="company"
            id="company"
            placeholder="Введите название компании"
          />
        </div>

        <div>
          <label for="firstname">Имя</label>
          <input type="firstname" id="firstname" placeholder="Имя" />
          <label for="lastname">Фамилия</label>
          <input type="lastname" id="lastname" placeholder="Фамилия" />
        </div>

        <div>
            <label for="email">E-mail</label>
            <input type="email" id="email" placeholder="Введите E-mail">
        </div>

        <div>
            <button>Зарегистрироваться</button>
        </div>

        <div>
            <input type="checkbox" name="agree" id="agree">
            <label for="agree">Я прочитал и принимаю</label>
        </div>
      </form>
    </main>
  </body>
</html>
